<section class="post-actions" aria-label="订阅与支持">
  <button class="post-action post-subscribe-toggle" type="button" aria-expanded="false" aria-controls="post-subscription-links">订阅</button>
  <a class="post-action post-support-link" href="https://roamfm.app/" target="_blank" rel="noopener noreferrer">支持作者</a>
  <div class="post-subscription-links" id="post-subscription-links" hidden>
    <a href="{{ "index.xml" | relLangURL }}">
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg>
      RSS
    </a>
    <a href="https://t.me/blogofjoe" target="_blank" rel="noopener noreferrer">
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      Telegram
    </a>
    <a href="{{ "wechat/" | relLangURL }}">
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L2 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
      微信公众号
    </a>
    <a href="https://x.com/houjoe1" target="_blank" rel="noopener noreferrer">
      <span aria-hidden="true">{{ partial "svg.html" (dict "name" "x") }}</span>
      X
    </a>
  </div>
</section>
<script>
{
  // 订阅入口在当前文章下方展开，再次点击时收起。
  const actions = document.currentScript.previousElementSibling;
  const toggle = actions.querySelector('.post-subscribe-toggle');
  const links = actions.querySelector('.post-subscription-links');
  toggle.addEventListener('click', function () {
    const expanded = toggle.getAttribute('aria-expanded') !== 'true';
    toggle.setAttribute('aria-expanded', String(expanded));
    links.hidden = !expanded;
  });
}
</script>
